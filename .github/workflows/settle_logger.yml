name: Outcome Settler

on:
  schedule:
    # FIX (2026-08): was once daily (04:00 UTC only), which meant a
    # market could sit "unsettled" in the dashboard for up to ~24h after
    # it actually resolved, purely from run-frequency lag -- not a data
    # problem, just staleness. Now every 4 hours. Safe to run this often
    # because settle_outcomes.py now skips re-querying any (city, date)
    # pair that already has a confirmed OFFICIAL result (see its
    # PERFORMANCE FIX note) -- so more frequent runs mostly do very
    # little extra work, they just catch newly-resolved dates sooner.
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Prevents this workflow from racing against ITSELF if triggered twice
# close together (e.g. a manual run overlapping a scheduled one, more
# likely now that it runs every 4 hours instead of once a day).
# It does NOT prevent races against the separate Hourly Weather Logger
# workflow -- that's handled by the retry-with-rebase push below instead,
# since we don't want the daily settlement job blocked for up to an hour
# waiting on the logger's own concurrency group.
concurrency:
  group: settle-outcomes
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests pandas
      - name: Recover legacy mixed-schema rows (safe to re-run; read-only on the raw log)
        run: python recover_legacy_log.py
      - run: python settle_outcomes.py
      - name: Commit and push (retry with rebase on conflict)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add polymarket_weather_evaluated.csv recovered/
          git commit -m "Auto-update outcome settlement [skip ci]" || exit 0

          # The Hourly Weather Logger workflow commits to the same branch
          # independently, so a push here can be rejected if it landed a
          # commit in between our checkout and our push. Retry a few
          # times with a rebase pull rather than failing the whole job.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Pushed successfully."
              exit 0
            fi
            echo "Push rejected (attempt $i/5) -- pulling and retrying..."
            git pull --rebase origin main
            sleep $((RANDOM % 10 + 5))
          done
          echo "Failed to push after 5 attempts."
          exit 1
