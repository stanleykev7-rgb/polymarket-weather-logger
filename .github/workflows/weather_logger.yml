name: Hourly Weather Logger

on:
  schedule:
    - cron: '0 * * * *' # Runs automatically every hour
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write # Grants write permissions to commit changes back to the repo

jobs:
  run-logger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Run Collector Script
        run: python weather_collector.py

      - name: Commit and Push Log Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # polymarket_weather_live_log.csv (v1) is frozen going forward --
          # new rows land in polymarket_weather_live_log_v2.csv (or a
          # higher version) once the schema changes; `git add -A` on
          # both patterns keeps whichever file(s) actually changed.
          git add polymarket_weather_live_log.csv polymarket_weather_live_log_v*.csv 2>/dev/null || true
          git commit -m "Auto-update weather log snapshot [skip ci]" || exit 0
          git push
