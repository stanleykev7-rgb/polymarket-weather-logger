name: Hourly Weather Logger

on:
  schedule:
    - cron: '0 * * * *' # Runs automatically every hour
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write # Grants write permissions to commit changes back to the repo

concurrency:
  group: weather-logger
  cancel-in-progress: false

jobs:
  run-logger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Run Collector Script
        run: python weather_collector.py

      - name: Commit and push (retry with rebase on conflict)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # polymarket_weather_live_log.csv (v1) is frozen going forward --
          # new rows land in polymarket_weather_live_log_v2.csv (or a
          # higher version) once the schema changes; `git add -A` on
          # both patterns keeps whichever file(s) actually changed.
          git add polymarket_weather_live_log.csv polymarket_weather_live_log_v*.csv 2>/dev/null || true
          git commit -m "Auto-update weather log snapshot [skip ci]" || exit 0

          # The Daily Outcome Settler workflow commits to the same branch
          # independently, so a push here can be rejected if it landed a
          # commit in between our checkout and our push. Retry a few
          # times with a rebase pull rather than failing the whole job.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Pushed successfully."
              exit 0
            fi
            echo "Push rejected (attempt $i/5) -- pulling and retrying..."
            git pull --rebase origin main
            sleep $((RANDOM % 10 + 5))
          done
          echo "Failed to push after 5 attempts."
          exit 1
